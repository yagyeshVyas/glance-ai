name: Release verification

# Runs after a release is published. Two jobs, both on a fresh GitHub-hosted
# Windows VM:
#   clean-install        installs the published signed x64 installer, checks the
#                        signer identity, launches the installed app and
#                        uninstalls it.
#   update-from-previous installs the previous published release, lets its
#                        updater find and apply the new release, then checks the
#                        installed version and launches it.
#
# The update job is the real published-update path: it uses the release's
# latest.yml and the app's own electron-updater, not a local feed.
#
# The install folder is named after executableName (GlanceAI), not productName
# (Glance AI), so paths are resolved from a candidate list rather than assumed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to verify
        required: true
        default: "3.4.0"
      previous:
        description: Previous published version for the update test
        required: true
        default: "3.3.7"

permissions:
  contents: read

jobs:
  clean-install:
    name: clean-install
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the published signed installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path installers -Force | Out-Null
          gh release download "v$env:VERSION" --pattern ("GlanceAI-{0}-x64.exe" -f $env:VERSION) --dir installers
          $exe = Get-ChildItem installers -Filter *-x64.exe | Select-Object -First 1
          if (-not $exe) { throw 'published x64 installer not found' }
          Unblock-File $exe.FullName

      - name: Check the signer identity
        shell: pwsh
        run: |
          $exe = Get-ChildItem installers -Filter *-x64.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          "status=$($sig.Status)"
          "subject=$($sig.SignerCertificate.Subject)"
          "thumbprint=$($sig.SignerCertificate.Thumbprint)"
          if (-not $sig.SignerCertificate) { throw 'installer is not signed' }
          if ($sig.SignerCertificate.Subject -notlike '*CN=Glance AI*') { throw 'wrong signer subject' }
          if ($sig.SignerCertificate.Thumbprint -ne '06468B493CB0318832E9894CA756E064DB06AACC') {
            throw 'wrong signer thumbprint'
          }
          # The certificate is self-signed and deliberately not trusted by the
          # installer, so Status is expected to be UnknownError. The signer
          # identity above is the check that matters on a clean machine.

      - name: Install silently
        shell: pwsh
        run: |
          $exe = Get-ChildItem installers -Filter *-x64.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }

      - name: Resolve the install and verify the version
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:ProgramFiles 'GlanceAI\GlanceAI.exe'),
            (Join-Path $env:ProgramFiles 'Glance AI\GlanceAI.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'GlanceAI\GlanceAI.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\GlanceAI\GlanceAI.exe')
          ) | Where-Object { $_ -and (Test-Path $_) }
          $exe = $candidates | Select-Object -First 1
          if (-not $exe) { throw "installed executable not found under $env:ProgramFiles" }
          $v = (Get-Item $exe).VersionInfo.ProductVersion
          "installed: $exe ($v)"
          if ($v -notlike "$env:VERSION*") { throw "installed version $v is not $env:VERSION" }
          "GLANCE_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Launch the installed app
        shell: pwsh
        run: |
          Get-Process -Name GlanceAI -ErrorAction SilentlyContinue | Stop-Process -Force
          $profile = Join-Path $env:RUNNER_TEMP 'glance-clean-profile'
          $marker = Join-Path $env:RUNNER_TEMP 'glance-clean-marker.txt'
          Remove-Item $marker -ErrorAction SilentlyContinue
          $env:RB_PROFILE_DIR = $profile
          $env:RB_SMOKE_FILE = $marker
          $p = Start-Process -FilePath $env:GLANCE_EXE -ArgumentList '--smoke-test' -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $marker)) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path $marker)) { throw 'installed app did not write its smoke marker' }
          $raw = (Get-Content $marker -Raw).Trim()
          if ($raw -ne 'ready') {
            try { $smoke = $raw | ConvertFrom-Json } catch { throw "smoke marker is not JSON: $raw" }
            if (-not $smoke.pass) { throw "smoke check failed: $raw" }
          }
          $p.WaitForExit(10000) | Out-Null
          'clean install launch: ok'

      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name GlanceAI -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $env:GLANCE_EXE) { return }
          $dir = Split-Path $env:GLANCE_EXE
          $u = Get-ChildItem $dir -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($u) { Start-Process -FilePath $u.FullName -ArgumentList '/S' -Wait }

  update-from-previous:
    name: update-from-previous
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      PREVIOUS: ${{ inputs.previous }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies for the CDP driver
        run: npm ci

      - name: Download and install the previous release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path installers -Force | Out-Null
          gh release download "v$env:PREVIOUS" --pattern ("GlanceAI-{0}-x64.exe" -f $env:PREVIOUS) --dir installers
          $exe = Get-ChildItem installers -Filter *-x64.exe | Select-Object -First 1
          if (-not $exe) { throw 'previous x64 installer not found' }
          Unblock-File $exe.FullName
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "previous installer exited $($p.ExitCode)" }

      - name: Resolve the previous install
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:ProgramFiles 'GlanceAI\GlanceAI.exe'),
            (Join-Path $env:ProgramFiles 'Glance AI\GlanceAI.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'GlanceAI\GlanceAI.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\GlanceAI\GlanceAI.exe')
          ) | Where-Object { $_ -and (Test-Path $_) }
          $exe = $candidates | Select-Object -First 1
          if (-not $exe) { throw "previous executable not found under $env:ProgramFiles" }
          $v = (Get-Item $exe).VersionInfo.ProductVersion
          "previous installed: $exe ($v)"
          if ($v -notlike "$env:PREVIOUS*") { throw "previous version $v is not $env:PREVIOUS" }
          "GLANCE_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Start the previous version with CDP
        shell: pwsh
        run: |
          Get-Process -Name GlanceAI -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          $profile = Join-Path $env:RUNNER_TEMP 'glance-update-profile'
          $env:RB_PROFILE_DIR = $profile
          $p = Start-Process -FilePath $env:GLANCE_EXE -ArgumentList '--remote-debugging-port=9333', '--disable-gpu' -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            node scripts/cdp-eval.js --port 9333 "document.readyState" 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { throw 'previous version did not expose CDP' }
          "started pid $($p.Id)"

      - name: Let the updater find and download the new release
        shell: pwsh
        run: |
          # The app downloads only after an explicit click (autoDownload is
          # false), so the test has to drive both halves of the real flow.
          node scripts/cdp-eval.js --port 9333 "window.glance.updateCheck()" 2>$null | Out-Null
          $deadline = (Get-Date).AddMinutes(3)
          $available = $false
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            $status = node scripts/cdp-eval.js --port 9333 "document.getElementById('status').textContent" 2>$null
            if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 3; continue }
            "status: $status"
            if ($status -match 'ready') { $ready = $true; break }
            if ($status -match 'available') { $available = $true; break }
            if ($status -match 'failed|error|unavailable') { throw "updater reported: $status" }
            Start-Sleep -Seconds 3
          }
          if (-not $ready -and -not $available) { throw 'updater did not offer the new release' }
          if ($available) {
            node scripts/cdp-eval.js --port 9333 "window.glance.updateDownload()" 2>$null | Out-Null
          }
          $deadline = (Get-Date).AddMinutes(12)
          while (-not $ready -and (Get-Date) -lt $deadline) {
            $status = node scripts/cdp-eval.js --port 9333 "document.getElementById('status').textContent" 2>$null
            if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 3; continue }
            "status: $status"
            if ($status -match 'ready') { $ready = $true; break }
            if ($status -match 'failed|error|unavailable') { throw "updater reported: $status" }
            Start-Sleep -Seconds 5
          }
          if (-not $ready) { throw 'updater did not reach the ready state' }

      - name: Apply the update
        shell: pwsh
        run: |
          # quitAndInstall closes the app while the evaluation is in flight, so
          # the CDP call is expected to lose its socket and exit non-zero.
          node scripts/cdp-eval.js --port 9333 "window.glance.updateInstall()" 2>$null | Out-Null
          $LASTEXITCODE = 0
          $deadline = (Get-Date).AddMinutes(8)
          $v = ''
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            try { $v = (Get-Item $env:GLANCE_EXE).VersionInfo.ProductVersion } catch { continue }
            if ($v -like "$env:VERSION*") { break }
          }
          "updated version: $v"
          if ($v -notlike "$env:VERSION*") { throw "update did not install $env:VERSION (found $v)" }
          $yml = Join-Path (Split-Path $env:GLANCE_EXE) 'resources\app-update.yml'
          if (-not (Test-Path $yml)) { throw 'updated app-update.yml is missing' }
          $pinned = Select-String -Path $yml -Pattern 'CN=Glance AI' -Quiet
          if (-not $pinned) { throw 'updated app-update.yml does not pin the publisher' }
          'updated app-update.yml pins the publisher'

      - name: Launch the updated app
        shell: pwsh
        run: |
          Get-Process -Name GlanceAI -ErrorAction SilentlyContinue | Stop-Process -Force
          $profile = Join-Path $env:RUNNER_TEMP 'glance-updated-profile'
          $marker = Join-Path $env:RUNNER_TEMP 'glance-updated-marker.txt'
          Remove-Item $marker -ErrorAction SilentlyContinue
          $env:RB_PROFILE_DIR = $profile
          $env:RB_SMOKE_FILE = $marker
          $p = Start-Process -FilePath $env:GLANCE_EXE -ArgumentList '--smoke-test' -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $marker)) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path $marker)) { throw 'updated app did not write its smoke marker' }
          $raw = (Get-Content $marker -Raw).Trim()
          if ($raw -ne 'ready') {
            try { $smoke = $raw | ConvertFrom-Json } catch { throw "updated smoke marker is not JSON: $raw" }
            if (-not $smoke.pass) { throw "updated smoke check failed: $raw" }
          }
          $p.WaitForExit(10000) | Out-Null
          'updated app launch: ok'

      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name GlanceAI -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $env:GLANCE_EXE) { return }
          $dir = Split-Path $env:GLANCE_EXE
          $u = Get-ChildItem $dir -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($u) { Start-Process -FilePath $u.FullName -ArgumentList '/S' -Wait }
