<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Glance AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="0.55" stop-color="#121724"/>
      <stop offset="1" stop-color="#0a0c11"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6c8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6c8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#43e0c8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#43e0c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#aab6d6"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <circle cx="250" cy="120" r="150" fill="url(#glowA)">
      <animate attributeName="cx" values="250;330;250" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="120;170;120" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="220" r="170" fill="url(#glowB)">
      <animate attributeName="cx" values="960;880;960" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;170;220" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0.5" stroke="#8ea2d8" stroke-width="1">
    <circle cx="600" cy="170" r="118" fill="none" stroke-dasharray="3 9">
      <animateTransform attributeName="transform" type="rotate" from="0 600 170" to="360 600 170" dur="34s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="170" r="152" fill="none" stroke-dasharray="2 12" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="360 600 170" to="0 600 170" dur="46s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <text x="600" y="150" text-anchor="middle" font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" font-size="82" font-weight="700" fill="url(#ink)" letter-spacing="1.5">
      Glance AI
      <animate attributeName="y" values="150;144;150" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#9fb0d3" letter-spacing="3">
      answers on your screen. absent from the share.
      <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <g fill="#6c8cff" opacity="0.85">
    <circle cx="420" cy="262" r="3">
      <animate attributeName="opacity" values="0;1;0" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="286" r="2.5">
      <animate attributeName="opacity" values="0;1;0" dur="4.1s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="262" r="3">
      <animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
